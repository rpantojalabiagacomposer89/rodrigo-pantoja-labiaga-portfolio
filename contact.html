<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Rodrigo Pantoja Labiaga</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="page contact-page">
    <h1>Contact</h1>
    <form class="contact-form" id="contact-form">
      <label>Name<input name="name" type="text" autocomplete="name" required></label>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Message<textarea name="message" required></textarea></label>
      <button type="submit">Send</button>
    </form>
    <p class="contact-email"><a href="mailto:rpantojalabiaga.composer@gmail.com">rpantojalabiaga.composer@gmail.com</a></p>
    <a class="corner-link" href="index.html">Home</a>
  </main>
  <script src="assets/js/contact.js"></script>
  <script src="assets/js/scale.js"></script>
</body>
</html>
